<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Memproses Login SSO - Sistem Mata Kuliah Perguruan Tinggi</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <style>
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: var(--color-page);
      font-family: var(--font-family-base);
    }

    .sso-processing {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 40px;
      background: var(--color-white);
      border: 1px solid var(--color-border-soft);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      text-align: center;
    }

    /* Cincin berputar; logoGitHub duduk tepat di tengahnya. */
    .sso-loader {
      position: relative;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
    }

    .sso-spinner {
      position: absolute;
      inset: 0;
      border: 3px solid rgba(36, 41, 47, 0.14);
      border-top-color: var(--color-primary);
      border-radius: var(--radius-full);
      animation: spin 0.75s linear infinite;
    }

    .brand-icon {
      position: relative;
      width: 22px;
      height: 22px;
      display: none;
      color: #24292f;
    }

    .brand-icon.is-visible {
      display: block;
    }

    .sso-processing p {
      font-size: 15px;
      font-weight: 500;
      color: var(--color-muted-dark);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="sso-processing" role="status" aria-live="polite">
    <span class="sso-loader" aria-hidden="true">
      <span class="sso-spinner"></span>
      <span class="brand-icon" id="brand-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" focusable="false">
          <path fill="currentColor" d="M12 .3a12 12 0 0 0-3.79 23.4c.6.11.82-.26.82-.58v-2.2c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.62-5.48 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.21.7.82.58A12 12 0 0 0 12 .3Z"/>
        </svg>
      </span>
    </span>
    <p id="status-text">Login SSO berhasil, mengalihkan...</p>
  </div>

  <script src="js/config.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');

      if (!token) {
        window.location.replace('index.html');
        return;
      }

      // Halaman ini dipakai SSO maupun GitHub, jadi teksnya ikut menyesuaikan
      // dengan cara pengguna masuk.
      if (params.get('provider') === 'github') {
        document.getElementById('status-text').textContent = 'Login GitHub berhasil, mengalihkan...';
        document.getElementById('page-title').textContent = 'Memproses Login GitHub - Sistem Mata Kuliah Perguruan Tinggi';
        document.getElementById('brand-icon').classList.add('is-visible');
      }

      // Bersihkan token dari URL (riwayat browser, log server, referrer)
      try {
        window.history.replaceState({}, document.title, window.location.pathname);
      } catch (error) { /* abaikan */ }

      sessionStorage.setItem(APP_CONFIG.STORAGE_KEYS.token, token);

      // Login GitHub mengirim refresh token juga; login SSO tidak.
      var refreshToken = params.get('refreshToken');
      if (refreshToken) {
        sessionStorage.setItem(APP_CONFIG.STORAGE_KEYS.refreshToken, refreshToken);
      }

      var apiBase = APP_CONFIG.API_BASE_URL;

      fetch(apiBase + '/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(function (r) {
          if (!r.ok) throw new Error('unauthorized');
          return r.json();
        })
        .then(function (data) {
          if (data.user) {
            sessionStorage.setItem(APP_CONFIG.STORAGE_KEYS.user, JSON.stringify(data.user));
          }
          window.setTimeout(function () {
            window.location.replace(APP_CONFIG.ROUTES.dashboard);
          }, 600);
        })
        .catch(function () {
          sessionStorage.removeItem(APP_CONFIG.STORAGE_KEYS.token);
          window.location.replace('index.html');
        });
    })();
  </script>
</body>
</html>
