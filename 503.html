<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login SSO sedang dalam perbaikan — 503 Service Unavailable">
  <title>503 Service Unavailable</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      color: #16233e;
    }

    /* Baris pertama dipakai penuh untuk ilustrasi, baris kedua setinggi teksnya.
       Ilustrasi lalu mengikuti ukuran viewport apa pun tanpa tebak-tebakan pixel. */
    .maintenance {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      justify-items: center;
      align-items: center;
      gap: clamp(14px, 2.4vh, 28px);
      padding: clamp(18px, 3vw, 40px);
      text-align: center;
      overflow: hidden;
    }

    .maintenance-illustration {
      height: 100%;
      min-height: 0;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .maintenance-illustration img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    .maintenance-text {
      display: grid;
      gap: clamp(6px, 0.8vh, 10px);
      max-width: 100%;
    }

    .maintenance-title {
      font-size: clamp(20px, 2.4vw, 36px);
      font-weight: 700;
      line-height: 1.2;
      color: #16233e;
      overflow-wrap: break-word;
    }

    .maintenance-note {
      font-size: clamp(14px, 1.2vw, 18px);
      font-weight: 500;
      line-height: 1.5;
      color: #5a6b87;
    }
  </style>
</head>
<body>
  <main class="maintenance">
    <!-- ================= ILUSTRASI MAINTENANCE ================= -->
    <div class="maintenance-illustration" aria-hidden="true">
      <img src="assets/images/503-maintenance.png" alt="Ilustrasi maintenance website">
    </div>

    <div class="maintenance-text">
      <h1 class="maintenance-title">Login SSO Sedang Dalam Perbaikan</h1>
      <p class="maintenance-note">Silakan kembali beberapa saat lagi.</p>
    </div>
  </main>

  <script>
    // Kunci halaman: cegah scroll roda/touch dan gesture yang menggeser halaman.
    ['wheel', 'touchmove', 'gesturestart'].forEach(function (type) {
      document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
    });
    document.addEventListener('keydown', function (e) {
      if ([32, 33, 34, 35, 36, 37, 38, 39, 40].indexOf(e.keyCode) !== -1) e.preventDefault();
    });
  </script>
</body>
</html>
