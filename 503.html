<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login SSO sedang dalam perbaikan — 503 Service Unavailable">
  <title>503 Service Unavailable</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      color: #16233e;
    }

    /* Satu kolom tengah: badge 503 jadi penanda utama, teks rapi di bawahnya. */
    .maintenance {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 3.6vh, 38px);
      padding: clamp(20px, 4vw, 48px);
      text-align: center;
      overflow: hidden;
    }

    .maintenance-code {
      display: inline-block;
      max-width: 100%;
      font-size: clamp(19px, 2.9vw, 38px);
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1.2;
      text-transform: uppercase;
      color: #33507f;
      background: #eef2f8;
      border: 1px solid #dde5f1;
      border-radius: 999px;
      padding: clamp(12px, 1.5vw, 18px) clamp(22px, 3.4vw, 40px);
      overflow-wrap: break-word;
    }

    .maintenance-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 1.6vh, 16px);
      max-width: 560px;
    }

    .maintenance-title {
      font-size: clamp(22px, 2.2vw, 32px);
      font-weight: 700;
      line-height: 1.25;
      color: #16233e;
      overflow-wrap: break-word;
    }

    .maintenance-desc {
      font-size: clamp(14px, 1.05vw, 16px);
      font-weight: 400;
      line-height: 1.65;
      color: #5a6b87;
      max-width: 46ch;
    }

    .maintenance-note {
      font-size: clamp(14px, 1.05vw, 16px);
      font-weight: 600;
      line-height: 1.5;
      color: #2c3e5e;
    }
  </style>
</head>
<body>
  <main class="maintenance">
    <p class="maintenance-code">503 Service Unavailable</p>

    <div class="maintenance-copy">
      <h1 class="maintenance-title">Login SSO Sedang Dalam Perbaikan</h1>
      <p class="maintenance-desc">Kami sedang melakukan pemeliharaan terjadwal agar layanan kembali lebih stabil dan andal.</p>
      <p class="maintenance-note">Silakan kembali beberapa saat lagi.</p>
    </div>
  </main>

  <script>
    // Kunci halaman: cegah scroll roda/touch dan gesture yang menggeser halaman.
    ['wheel', 'touchmove', 'gesturestart'].forEach(function (type) {
      document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
    });
    document.addEventListener('keydown', function (e) {
      if ([32, 33, 34, 35, 36, 37, 38, 39, 40].indexOf(e.keyCode) !== -1) e.preventDefault();
    });
  </script>
</body>
</html>
