# render.yaml — Blueprint untuk https://dashboard.render.com (Free)
# ponytail: 24 jam online — DB MySQL external (Render free hanya Postgres), pakai Railway/Aiven untuk MySQL
services:
  - type: web
    name: web-kelas
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: CORS_ORIGIN
        value: https://*.onrender.com,https://*.up.railway.app,http://localhost:3000
      - key: FRONTEND_BASE_URL
        sync: false
